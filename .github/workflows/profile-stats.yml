name: GitHub Profile Summary Cards

on:
  schedule:
    # Запускается каждый день в 03:00 по UTC
    - cron: '0 3 * * *'
  # Позволяет запустить генерацию вручную из вкладки Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: Generate Stats Cards

    steps:
      - uses: actions/checkout@v4

      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          THEME: dracula
          # Исключаем язык Blade из статистики, как в вашем исходном запросе
          EXCLUDE: blade
